<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Turistattraktioner</title>
    <link th:href="@{/main.css}" rel="stylesheet">
</head>
<body>
<h1>Tursitattraktioner</h1>
<table>
    <th>Navn</th>
    <th>Beskrivelse</th>
    <th>By</th>
    <tr th:each="attraction : ${list}">
        <td th:text="${attraction.name}"></td>
        <td th:text="${attraction.description}"></td>
        <td th:text="${cityList.get(attraction.getCity())}"></td>
        <td>
            <form action="#" th:action="@{/attraction/update}" method="post">
                <input type="hidden" name="id" th:value="${attraction.id}">
                <button type="submit">Opdater</button>
            </form>
        </td>
        <td>
            <form action="#" th:action="@{/attraction/delete}" method="post">
                <input type="hidden" name="id" th:value="${attraction.id}">
                <button type="submit">Slet</button>
            </form>
        </td>
        <td>
            <form action="#" th:action="@{/attraction/tags}" method="post">
                <input type="hidden" name="id" th:value="${attraction.id}">
                <button type="submit">Tags</button>
            </form>
        </td>
    </tr>

</table>
<a th:href="@{/attraction/add}">
    <button>
        Add Attraction
    </button>
</a>
</body>
</html>
