<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Turistattraktioner</title>
    <link th:href="@{/main.css}" rel="stylesheet">
</head>
<body>
<h1>Tursitattraktioner</h1>
<table>
    <th>Navn</th>
    <th>Beskrivelse</th>
    <th></th>
    <tr th:each="attraction : ${list}">
        <td th:text="${attraction.name}"></td>
        <td th:text="${attraction.description}"></td>
        <td>
            <form action="#" th:action="@{/attraction/update}" th:object="${attraction}" method="post">
                <input type="hidden" th:field="*{name}"/>
                <input type="hidden" th:field="*{description}"/>
                <input type="hidden" th:field="*{city}"/>

                <button type="submit">Opdater</button>
            </form>
        </td>
        <td>
            <form action="#" th:action="@{/attraction/delete}" th:object="${attraction}" method="post">
                <button type="submit">Slet</button>
            </form>
        </td>
        <td>
            <form action="#" th:action="@{/attraction/tags}" th:object="${attraction}" method="post">
                <button type="submit">Tags</button>
            </form>
        </td>
    </tr>

</table>
    <a th:href="@{/attraction/add}">
        <button>
            Add Attraction
        </button>
    </a>
</body>
</html>
