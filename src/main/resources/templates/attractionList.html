<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Turistattraktioner</title>
    <link th:href="@{/main.css}" rel="stylesheet">
</head>
<body>
<h1>Tursitattraktioner</h1>
<table>
    <th>Navn</th>
    <th>Beskrivelse</th>
    <th></th>
    <tr th:each="attraction : ${list}">
        <td th:text="${attraction.name}"></td>
        <td th:text="${attraction.description}"></td>
        <td>
            <a th:href="@{/attraction/update}" th:object="attraction"><button>Opdater</button></a>
        </td>
        <td>
            <a th:href="@{/attraction/delete}" th:object="attraction"><button>Slet</button></a>
        </td>
        <td>
            <a th:href="@{/attraction/tags}" th:object="attraction"><button>Tags</button></a>
        </td>
    </tr>

</table>
    <a th:href="@{/attraction/add}">
        <button>
            Add Attraction
        </button>
    </a>
</body>
</html>
